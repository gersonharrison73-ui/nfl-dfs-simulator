<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NFL DFS Simulator</title>

<style>
:root{
  --bg:#0b1020;
  --card:#151c31;
  --muted:#9aa5b5;
  --text:#f4f7fb;
  --accent:#4f8cff;
  --green:#24c77a;
  --border:#28334d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
main{
  max-width:760px;
  margin:auto;
  padding:18px;
}
h1{font-size:27px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 14px}
.small{font-size:12px;color:var(--muted)}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}
input,select,button{
  width:100%;
  font:inherit;
}
input,select{
  background:#0e1527;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}
button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:bold;
  cursor:pointer;
  background:var(--accent);
  color:white;
}
button.secondary{background:#273149}
button.green{background:var(--green);color:#07130d}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.status{
  padding:10px;
  background:#0e1527;
  border-radius:10px;
  color:#b8c5d8;
}
.lineup{
  background:#0e1527;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
.player{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #222c42;
}
.player:last-child{border-bottom:0}
.badge{
  padding:3px 7px;
  border-radius:7px;
  background:#26334e;
  font-size:11px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:7px 4px;
  border-bottom:1px solid #263047;
  text-align:left;
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

function attachSyntheticOwnership(list){

// The sample pool has no real ownership data. This is only a rough
// stand-in — a real projections-site export (with an Own%/pOwn
// column) will overwrite it entirely on CSV import.
const maxProj=Math.max(...list.map(p=>p.proj));

list.forEach(p=>{

const valueScore=(p.proj/Math.max(1,p.salary))*1000;

let own=(p.proj/maxProj)*32 + valueScore*1.8;

own=Math.max(2,Math.min(45,Math.round(own)));

p.own=own;
p.floor=+(p.proj*0.65).toFixed(1);

});

return list;

}

    document.getElementById("results").innerHTML =

}

function randNormal(){

return (
Math.random()+
Math.random()+
Math.random()
-1.5
);

}

function simulatePlayer(p){

let sd=Math.max(1,(p.ceil-p.proj)*.45);

return Math.max(
0,
p.proj + randNormal()*sd
);

}

function scoreLineup(lineup){

let runs=Math.min(
Math.max(1,+document.getElementById("sims").value),
300
);

let total=0;

for(let i=0;i<runs;i++){

let score=0;

lineup.players.forEach(p=>{
score+=simulatePlayer(p);
});

total+=score;

}

let avg=total/runs;

return avg+
(lineup.ceiling-avg)*.25;

}

function leverageScore(p){

// Rewards players whose ceiling upside is large relative to how
// lightly-owned they are — i.e. plays where being right pays off
// disproportionately because few other lineups have them.
const own=(p.own===undefined || p.own===null) ? 15 : p.own;

return (p.ceil - p.proj) * (1 - own/100);

}

function getChalkFade(){

const el=document.getElementById("chalkFade");

return el ? (+el.value || 0) : 0;

}

function pick(arr,count){

  const chalkFade=getChalkFade();

  let copy=[...arr].sort((a,b)=>{

    const aValue = (a.proj / Math.max(1,a.salary)) * 1000;
    const bValue = (b.proj / Math.max(1,b.salary)) * 1000;

    const aOwn=(a.own===undefined || a.own===null)?15:a.own;
    const bOwn=(b.own===undefined || b.own===null)?15:b.own;

    // Chalk fade does two things, both scaled by the selected
    // strength: it directly discounts highly-owned players (so a
    // popular stud doesn't win purely on raw projection), and it
    // rewards players whose ceiling upside is large relative to how
    // lightly they're owned (the classic GPP leverage play).
    const aLev = leverageScore(a) * chalkFade * 0.6;
    const bLev = leverageScore(b) * chalkFade * 0.6;

    const aOwnPenalty = (aOwn/100) * chalkFade * 7;
    const bOwnPenalty = (bOwn/100) * chalkFade * 7;

    const aScore =
      a.proj * 0.45 +
      a.ceil * 0.15 +
      aValue * 0.20 +
      aLev -
      aOwnPenalty +
      Math.random() * 6;

    const bScore =
      b.proj * 0.45 +
      b.ceil * 0.15 +
      bValue * 0.20 +
      bLev -
      bOwnPenalty +
      Math.random() * 6;

    return bScore - aScore;
  });

  return copy.slice(0,count);
}

function weightedSampleByOwnership(pool,count){

// Weighted random sample without replacement. Weight = ownership%,
// with a floor so even 0%-owned players can occasionally show up
// in a simulated field (real fields aren't perfectly efficient).
let candidates=pool.map(p=>({p,w:Math.max(0.5,p.own||15)}));

let picks=[];

for(let i=0;i<count && candidates.length;i++){

let totalW=candidates.reduce((s,c)=>s+c.w,0);

let r=Math.random()*totalW;

let idx=0;

for(;idx<candidates.length;idx++){
    r-=candidates[idx].w;
    if(r<=0)break;
}

idx=Math.min(idx,candidates.length-1);

picks.push(candidates[idx].p);

candidates.splice(idx,1);

}

return picks;

}

function buildField(fieldSize){

// A rough model of "the field": lineups built by sampling players
// weighted by projected ownership rather than by an optimizer.
// Real entrants still have to fill out a legal, salary-cap-legal
// roster, so field lineups are rejected and resampled if they don't
// fit the cap — otherwise the field skews unrealistically cheap and
// our own cap-maximizing lineups beat it 100% of the time by default.
//
// Only realistically-rosterable players are eligible — a full DK
// salary export includes dozens of inactive/4th-string players with
// ~0 projection that no real entrant would use.
const rosterable=players.filter(p=>p.proj>0.5);

const cap=+document.getElementById("cap").value;
const posNeeds=[["QB",1],["RB",2],["WR",3],["TE",1],["DST",1]];

let field=[];

for(let i=0;i<fieldSize;i++){

for(let attempt=0;attempt<25;attempt++){

let roster=[];
let ok=true;

posNeeds.forEach(([pos,count])=>{

const pool=rosterable.filter(p=>
    p.pos===pos && !roster.some(x=>x.id===p.id)
);

const picked=weightedSampleByOwnership(pool,count);

if(picked.length<count)ok=false;

roster.push(...picked);

});

if(ok){

const flexPool=rosterable.filter(p=>
    ["RB","WR","TE"].includes(p.pos) &&
    !roster.some(x=>x.id===p.id)
);

const flexPick=weightedSampleByOwnership(flexPool,1)[0];

if(flexPick){
    roster.push(flexPick);
}else{
    ok=false;
}

}

if(ok && roster.length===9){

const salary=roster.reduce((s,p)=>s+p.salary,0);

if(salary<=cap){
    field.push(roster);
    break;
}

}

}

}

return field;

}

function battleTest(lineup,field,trials,cashLinePct){

let winCount=0;
let cashCount=0;
let percentileSum=0;

const cashRank=Math.max(1,Math.round(field.length*(cashLinePct/100)));

for(let t=0;t<trials;t++){

const myScore=lineup.players.reduce(
    (s,p)=>s+simulatePlayer(p),0
);

const fieldScores=field.map(roster=>
    roster.reduce((s,p)=>s+simulatePlayer(p),0)
);

const beatCount=fieldScores.filter(s=>myScore>s).length;

percentileSum+=beatCount/fieldScores.length;

const rank=fieldScores.length-beatCount+1;

if(rank===1)winCount++;

if(rank<=cashRank)cashCount++;

}

return {
    winPct:(winCount/trials)*100,
    cashPct:(cashCount/trials)*100,
    avgPercentile:(percentileSum/trials)*100
};

}

function makeLineup(forceLowOwn, lowOwnThreshold){

  const cap = +document.getElementById("cap").value;
  const stackCount = Math.min(3, +document.getElementById("qbStack").value);
  const bringCount = Math.min(2, +document.getElementById("bring").value);

  const qbs = players.filter(p => p.pos === "QB");

  // Bail out immediately if the pool can't possibly fill a roster,
  // instead of burning 500 attempts finding that out the hard way.
  if(
    qbs.length < 1 ||
    players.filter(p => p.pos === "RB").length < 2 ||
    players.filter(p => p.pos === "WR").length < 3 ||
    players.filter(p => p.pos === "TE").length < 1 ||
    players.filter(p => p.pos === "DST").length < 1
  ){
    return null;
  }

  // Cheapest available player at each position, used to check whether
  // a pick would still leave enough salary to legally finish the
  // roster. Without this, pick() (which favors high-projection
  // players) tends to spend almost the entire cap on the first few
  // slots and then has nothing left for FLEX/DST — which is why
  // lineups could fail to generate at all under a tight cap.
  const posMin = {
    QB: Math.min(...players.filter(p => p.pos === "QB").map(p => p.salary)),
    RB: Math.min(...players.filter(p => p.pos === "RB").map(p => p.salary)),
    WR: Math.min(...players.filter(p => p.pos === "WR").map(p => p.salary)),
    TE: Math.min(...players.filter(p => p.pos === "TE").map(p => p.salary)),
    DST: Math.min(...players.filter(p => p.pos === "DST").map(p => p.salary))
  };
  const flexMin = Math.min(posMin.RB, posMin.WR, posMin.TE);
  const rosterReq = { QB:1, RB:2, WR:3, TE:1, DST:1 };

  function remainingMinCost(chosenList){
    const counts = { QB:0, RB:0, WR:0, TE:0, DST:0 };
    chosenList.forEach(p => { if(counts[p.pos] !== undefined) counts[p.pos]++; });

    let cost = 0;
    let mandatoryRemaining = 0;

    Object.keys(rosterReq).forEach(pos => {
      const need = Math.max(0, rosterReq[pos] - counts[pos]);
      cost += need * posMin[pos];
      mandatoryRemaining += need;
    });

    const flexNeeded = Math.max(0, 9 - chosenList.length - mandatoryRemaining);
    cost += flexNeeded * flexMin;

    return cost;
  }

  function affordable(candidate, chosenSoFar, cap){
    const projected = [...chosenSoFar, candidate];
    const salarySoFar = projected.reduce((s,p) => s + p.salary, 0);
    return salarySoFar + remainingMinCost(projected) <= cap;
  }

  for(let attempt=0; attempt<500; attempt++){

    const qb = pick(qbs,1)[0];
    if(!qb) continue;
    let chosen = [qb];

    // QB STACK
    const stackPool = players.filter(p =>
      p.team === qb.team &&
      ["WR","TE"].includes(p.pos) &&
      !chosen.some(x => x.id === p.id) &&
      affordable(p, chosen, cap)
    );

    if(stackPool.length < stackCount) continue;

    chosen.push(...pick(stackPool,stackCount));

    // BRING-BACK
    const bringPool = players.filter(p =>
      p.team === qb.opp &&
      ["RB","WR","TE"].includes(p.pos) &&
      !chosen.some(x => x.id === p.id) &&
      affordable(p, chosen, cap)
    );

    if(bringPool.length < bringCount) continue;

    chosen.push(...pick(bringPool, bringCount));

// Make sure stack/bring-back selections
// do not exceed the DraftKings position limits.
const positionLimits = {
    QB: 1,
    RB: 2,
    WR: 3,
    TE: 1,
    DST: 1
};

const positionCounts = {};

chosen.forEach(p => {
    positionCounts[p.pos] = (positionCounts[p.pos] || 0) + 1;
});

if(
    Object.keys(positionCounts).some(
        pos => (positionCounts[pos] || 0) > positionLimits[pos]
    )
){
    continue;
}

// Fill required positions
function fillPosition(pos,minCount){

      const current = chosen.filter(p => p.pos === pos).length;
      const need = minCount - current;

      if(need <= 0) return true;

      const pool = players.filter(p =>
        p.pos === pos &&
        !chosen.some(x => x.id === p.id) &&
        affordable(p, chosen, cap)
      );

      if(pool.length < need) return false;

      chosen.push(...pick(pool,need));

      return true;
    }

    if(!fillPosition("RB",2)) continue;
    if(!fillPosition("WR",3)) continue;
    if(!fillPosition("TE",1)) continue;
    if(!fillPosition("DST",1)) continue;

  // At this point we need exactly 8 players.
// Stack and bring-back players are already included
// in the RB/WR/TE position requirements.
// The 9th player is FLEX.
if(chosen.length !== 8) continue;

  const currentSalary = chosen.reduce(
  (total,p) => total + p.salary,
  0
);

let flexPool = players.filter(p =>
  ["RB","WR","TE"].includes(p.pos) &&
  !chosen.some(x => x.id === p.id) &&
  currentSalary + p.salary <= cap
);

// If a leverage quota is active and this lineup doesn't already
// have a qualifying low-owned player, force FLEX to be one.
if(forceLowOwn){

const ownOf = p => (p.own===undefined || p.own===null) ? 15 : p.own;

const alreadyHasLeverage = chosen.some(p => ownOf(p) <= lowOwnThreshold);

if(!alreadyHasLeverage){

const leveragePool = flexPool.filter(p => ownOf(p) <= lowOwnThreshold);

if(!leveragePool.length) continue;

flexPool = leveragePool;

}

}

if(!flexPool.length) continue;

chosen.push(pick(flexPool,1)[0]);

    // Final validation
    if(chosen.length !== 9) continue;

    const salary = chosen.reduce(
      (total,p) => total + p.salary,
      0
    );

    if(salary > cap) continue;

    const qbCount = chosen.filter(p => p.pos === "QB").length;
    const rbCount = chosen.filter(p => p.pos === "RB").length;
    const wrCount = chosen.filter(p => p.pos === "WR").length;
    const teCount = chosen.filter(p => p.pos === "TE").length;
    const dstCount = chosen.filter(p => p.pos === "DST").length;
    if(qbCount !== 1) continue;
if(rbCount < 2) continue;
if(wrCount < 3) continue;
if(teCount < 1) continue;
if(dstCount !== 1) continue;
    // Avoid QB vs DST
    const dst = chosen.find(p => p.pos === "DST");

    if(
      document.getElementById("avoid").value === "yes" &&
      dst &&
      dst.team === qb.team
    ){
      continue;
    }

    const projection = chosen.reduce(
      (total,p) => total + p.proj,
      0
    );

    const ceiling = chosen.reduce(
      (total,p) => total + p.ceil,
      0
    );

    return {
      players: chosen,
      salary,
      projection,
      ceiling,
      score: 0
    };
  }

  return null;
}

async function generate(){

if(players.length<20){
    loadSample();
}

results=[];

let target=Math.min(
Math.max(1,+document.getElementById("num").value),
150
);

let exposure=Math.max(
1,
Math.floor(
target*(+document.getElementById("exposure").value/100)
)
);

let unique=+document.getElementById("unique").value;

let leverageOwn=Math.max(1,+document.getElementById("leverageOwn").value);
let leverageQuotaPct=Math.max(0,Math.min(100,+document.getElementById("leverageQuotaPct").value));
let leverageTargetCount=Math.ceil(target*(leverageQuotaPct/100));
let leverageCount=0;
let leverageInfeasible=false;

// Feasibility check: if literally no FLEX-eligible player is at or
// below the threshold, forcing it would fail every single attempt
// forever. Bail out of the quota up front instead of hanging.
{
const ownOf=p=>(p.own===undefined || p.own===null)?15:p.own;
const anyEligible=players.some(p=>
    ["RB","WR","TE"].includes(p.pos) && ownOf(p)<=leverageOwn
);
if(leverageTargetCount>0 && !anyEligible){
    leverageInfeasible=true;
    leverageTargetCount=0;
}
}

// Circuit breaker: if forcing a leverage play keeps failing (e.g.
// only a couple of qualifying players exist and exposure/uniqueness
// rules have exhausted them), stop forcing after enough consecutive
// misses instead of retrying up to the hard cap every time.
let forceFailStreak=0;
const FORCE_FAIL_LIMIT=300;

let counts={};
let seen=[];

let tries=0;
let maxTries=target*10000;

let failReasons={
    makeLineup:0,
    duplicate:0,
    exposure:0,
    unique:0
};

const btn=document.getElementById("generateBtn");
btn.disabled=true;

document.getElementById("status").innerText=
"Generating and simulating...";

while(results.length<target && tries<maxTries){

tries++;

// Yield back to the browser periodically so the tab doesn't
// look frozen during a large run, and show live progress.
if(tries % 300 === 0){
    document.getElementById("status").innerText=
    "Generating... "+results.length+"/"+target+
    " lineups (attempt "+tries+")";
    await new Promise(r=>setTimeout(r,0));
}

let wantsForce=
    (leverageTargetCount - leverageCount) > 0 &&
    (leverageTargetCount - leverageCount) >= (target - results.length);

let lineup=makeLineup(wantsForce, leverageOwn);

if(!lineup){
    failReasons.makeLineup++;

    if(wantsForce){
        forceFailStreak++;
        if(forceFailStreak>=FORCE_FAIL_LIMIT){
            // Quota isn't achievable at this exposure/uniqueness
            // setting — stop insisting on it so generation can still
            // finish, and report the shortfall at the end.
            leverageTargetCount=leverageCount;
            leverageInfeasible=true;
        }
    }

    continue;
}

forceFailStreak=0;

let key=lineup.players
.map(p=>p.id)
.sort()
.join("|");

if(seen.includes(key)){
    failReasons.duplicate++;
    continue;
}

if(lineup.players.some(
    p=>(counts[p.id]||0)>=exposure
)){
    failReasons.exposure++;
    continue;
}

// Compare against every lineup accepted so far, not just the
// most recent one, so "minimum unique players" actually holds
// across the whole set.
if(results.length){

let tooSimilar=results.some(existing=>{

let common=lineup.players.filter(
p=>existing.players.some(x=>x.id===p.id)
).length;

return common>9-unique;

});

if(tooSimilar){
    failReasons.unique++;
    continue;
}

}

seen.push(key);

lineup.score=scoreLineup(lineup);

lineup.players.forEach(
p=>counts[p.id]=(counts[p.id]||0)+1
);

const ownOf=p=>(p.own===undefined || p.own===null)?15:p.own;

if(lineup.players.some(p=>ownOf(p)<=leverageOwn)){
    leverageCount++;
}

results.push(lineup);

}

results.sort((a,b)=>b.score-a.score);

renderResults();

// Battle-test the top lineups against a synthetic ownership-weighted
// field: how often does this lineup actually beat a plausible field
// of the field's rosters, not just its own raw sim score?
if(results.length){

document.getElementById("status").innerText=
"Generated "+results.length+" lineups. Running field battle analysis...";

await new Promise(r=>setTimeout(r,0));

const fieldSize=Math.min(
Math.max(20,+document.getElementById("fieldSize").value),
1000
);

const cashLine=Math.min(
Math.max(1,+document.getElementById("cashLine").value),
100
);

const trials=Math.min(
Math.max(1,+document.getElementById("sims").value),
50
);

const field=buildField(fieldSize);

const toAnalyze=results.slice(0,20);

for(let i=0;i<toAnalyze.length;i++){

const lineup=toAnalyze[i];

lineup.totalOwn=lineup.players.reduce(
(s,p)=>s+(p.own||0),0
);

if(field.length){

const battle=battleTest(lineup,field,trials,cashLine);

lineup.winPct=battle.winPct;
lineup.cashPct=battle.cashPct;
lineup.avgPercentile=battle.avgPercentile;

}

if(i % 3 === 0){
    document.getElementById("status").innerText=
    "Running field battle analysis... "+(i+1)+"/"+toAnalyze.length;
    await new Promise(r=>setTimeout(r,0));
}

}

renderResults();

}

btn.disabled=false;

document.getElementById("status").innerText=
"Generated "+results.length+
" lineups after " + tries + " attempts. " +
"Leverage plays (\u2264"+leverageOwn+"% own): "+leverageCount+"/"+results.length+
" (target was "+Math.ceil(target*(leverageQuotaPct/100))+"). "+
(leverageInfeasible?"Quota could not be fully met with the current player pool/exposure settings. ":"")+
"Failures: makeLineup="+failReasons.makeLineup+
", duplicate="+failReasons.duplicate+
", exposure="+failReasons.exposure+
", unique="+failReasons.unique;

}

function renderResults(){

if(!results.length){

document.getElementById("results").innerText=
"No valid lineups found.";

return;

}

let html="";

results.slice(0,20).forEach((l,i)=>{

const hasBattle = l.winPct !== undefined;

html+=`
<div class="lineup">
<div>
<strong>#${i+1}</strong>
&nbsp; $${l.salary.toLocaleString()}
&nbsp; <b>${l.score.toFixed(1)} sim pts</b>
</div>

<div class="small">
Projection: ${l.projection.toFixed(1)}
&nbsp; Ceiling: ${l.ceiling.toFixed(1)}
${l.totalOwn!==undefined?`&nbsp; Roster Own: ${l.totalOwn.toFixed(0)}%`:""}
</div>

${hasBattle?`
<div class="small">
vs field — Win: ${l.winPct.toFixed(1)}%
&nbsp; Cash: ${l.cashPct.toFixed(1)}%
&nbsp; Avg percentile: ${l.avgPercentile.toFixed(0)}th
</div>
`:""}

${l.players.map(p=>`
<div class="player">
<span>
<span class="badge">${p.pos}</span>
${p.name}
</span>
<span>${p.team}${p.own!==undefined?` &nbsp; <span class="small">${p.own.toFixed(0)}% own</span>`:""}</span>
</div>
`).join("")}

</div>
`;

});

document.getElementById("results").innerHTML=html;

}

function downloadCSV(){

if(!results.length){

alert("Generate lineups first.");

return;

}

let rows=[
[
"Lineup",
"QB",
"RB1",
"RB2",
"WR1",
"WR2",
"WR3",
"TE",
"FLEX",
"DST",
"Salary",
"Projection",
"Ceiling",
"Sim Score",
"Roster Own%",
"Win% vs Field",
"Cash% vs Field"
]
];

results.forEach((l,i)=>{

function by(pos){

return l.players.filter(p=>p.pos==pos);

}

let qb=by("QB")[0];
let rb=by("RB");
let wr=by("WR");
let te=by("TE");
let dst=by("DST")[0];

// makeLineup() always pushes the FLEX pick last, after every
// required position slot has already been filled, so the last
// player in the array is guaranteed to be the FLEX player.
let flex=l.players[l.players.length-1];

rows.push([
i+1,
qb?.name||"",
rb[0]?.name||"",
rb[1]?.name||"",
wr[0]?.name||"",
wr[1]?.name||"",
wr[2]?.name||"",
te[0]?.name||"",
flex?.name||"",
dst?.name||"",
l.salary,
l.projection.toFixed(2),
l.ceiling.toFixed(2),
l.score.toFixed(2),
l.totalOwn!==undefined?l.totalOwn.toFixed(1):"",
l.winPct!==undefined?l.winPct.toFixed(1):"",
l.cashPct!==undefined?l.cashPct.toFixed(1):""
]);

});

let csv=rows.map(
r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")
).join("\n");

let a=document.createElement("a");

a.href=URL.createObjectURL(
new Blob([csv],{type:"text/csv"})
);

a.download="nfl_dfs_lineups.csv";

a.click();

}

function copyTop(){

if(!results.length){

alert("Generate lineups first.");

return;

}

let l=results[0];

let text=l.players.map(
p=>`${p.pos}: ${p.name}`
).join("\n");

navigator.clipboard?.writeText(text)
.then(()=>alert("Top lineup copied."));

}
  
window.loadSample = loadSample;
window.clearPlayers = clearPlayers;
window.generate = generate;
window.copyTop = copyTop;
