<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL DFS Simulator</title>

<style>
:root{
  --bg:#0b1020;
  --card:#151c31;
  --muted:#9aa5b5;
  --text:#f4f7fb;
  --accent:#4f8cff;
  --green:#24c77a;
  --border:#28334d;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
main{
  max-width:760px;
  margin:auto;
  padding:18px;
}
h1{font-size:27px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 14px}
.small{font-size:12px;color:var(--muted)}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}
input,select,button{
  width:100%;
  font:inherit;
}
input,select{
  background:#0e1527;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}
button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:bold;
  cursor:pointer;
  background:var(--accent);
  color:white;
}
button.secondary{background:#273149}
button.green{background:var(--green);color:#07130d}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.status{
  padding:10px;
  background:#0e1527;
  border-radius:10px;
  color:#b8c5d8;
}
.lineup{
  background:#0e1527;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
.player{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #222c42;
}
.player:last-child{border-bottom:0}
.badge{
  padding:3px 7px;
  border-radius:7px;
  background:#26334e;
  font-size:11px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:7px 4px;
  border-bottom:1px solid #263047;
  text-align:left;
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<main>

<div class="card">
  <h1>🏈 NFL DFS Simulator</h1>
  <div class="small">
    DraftKings-style lineup generator, stacking rules and player simulation.
  </div>
</div>

<div class="card">
<h2>Lineup Settings</h2>

<div class="grid">

<div>
<label>Lineups</label>
<input id="num" type="number" value="20" min="1" max="150">
</div>

<div>
<label>Salary Cap</label>
<input id="cap" type="number" value="50000">
</div>

<div>
<label>QB Stack</label>
<select id="qbStack">
<option value="0">0</option>
<option value="1" selected>1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>

<div>
<label>Bring Back</label>
<select id="bring">
<option value="0">0</option>
<option value="1" selected>1</option>
<option value="2">2</option>
</select>
</div>

<div>
<label>Simulation Runs</label>
<input id="sims" type="number" value="100" min="1" max="300">
</div>

<div>
<label>Max Player Exposure %</label>
<input id="exposure" type="number" value="60" min="1" max="100">

<div>

<select id="unique">
<option value="0">0</option>

<option value="3">3</option>

<div>

<select id="avoid">

</div>

</div>
</div>

<div class="card">

<div class="buttons">

<button class="secondary" onclick="clearPlayers()">Clear Pool</button>

<div style="margin-top:12px">

<div id="poolStatus" class="status" style="margin-top:12px">
Ready.

</div>

<div class="card">

<div class="buttons">
<button class="green" id="generateBtn" onclick="generate()">
Generate Lineups</button>

<div id="status" class="status" style="margin-top:12px">
Ready.
</div>
</div>

<div class="card">
<h2>Results</h2>
<div id="results">

</div>

function loadSample(){

players=samplePlayers();

document.getElementById("poolStatus").innerText=
"Loaded "+players.length+" sample players.";

}

function clearPlayers(){

players=[];

document.getElementById("poolStatus").innerText=
"Player pool cleared.";

document.getElementById("file").addEventListener("change",function(e){

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(){

const lines=reader.result.trim().split(/\r?\n/);

const header=lines[0].split(",").map(x=>x.trim());

const idx={
name:header.findIndex(x=>x.toLowerCase()=="name"),
pos:header.findIndex(x=>x.toLowerCase()=="position" || x.toLowerCase()=="pos"),
salary:header.findIndex(x=>x.toLowerCase()=="salary"),
team:header.findIndex(x=>x.toLowerCase().includes("team")),
proj:header.findIndex(x=>x.toLowerCase().includes("projection")),
id:header.findIndex(x=>x.toLowerCase()=="id")
};

players=lines.slice(1).map((line,i)=>{

const c=line.split(",");

return {
id:idx.id>=0?c[idx.id]:(i+1),
name:c[idx.name]||"Player "+(i+1),
pos:(c[idx.pos]||"WR").toUpperCase(),
team:idx.team>=0?c[idx.team]:"",
opp:"",
salary:+(c[idx.salary]||0),
proj:+(c[idx.proj]||0),
ceil:+(c[idx.proj]||0)*1.35
};

}).filter(p=>p.salary>0);

document.getElementById("poolStatus").innerText=
"Imported "+players.length+" players.";

};

reader.readAsText(file);

});

function randNormal(){

return (
Math.random()+
Math.random()+
Math.random()
-1.5
);

}

function simulatePlayer(p){

let sd=Math.max(1,(p.ceil-p.proj)*.45);

return Math.max(
0,
p.proj + randNormal()*sd
);

}

function scoreLineup(lineup){

let runs=Math.min(
Math.max(1,+document.getElementById("sims").value),
300
);

let total=0;

for(let i=0;i<runs;i++){

let score=0;

lineup.players.forEach(p=>{
score+=simulatePlayer(p);
});

total+=score;

}

let avg=total/runs;

return avg+
(lineup.ceiling-avg)*.25;

}

function pick(arr,count){

  let copy=[...arr].sort((a,b)=>{

    const aValue = (a.proj / Math.max(1,a.salary)) * 1000;
    const bValue = (b.proj / Math.max(1,b.salary)) * 1000;

    const aScore =
      a.proj * 0.65 +
      a.ceil * 0.20 +
      aValue * 0.15 +
      Math.random() * 2;

    const bScore =
      b.proj * 0.65 +
      b.ceil * 0.20 +
      bValue * 0.15 +
      Math.random() * 2;

    return bScore - aScore;
  });

  return copy.slice(0,count);
}

function validLineup(chosen){

if(chosen.length!==9)return false;

let salary=chosen.reduce((a,p)=>a+p.salary,0);

let cap=+document.getElementById("cap").value;

if(salary>cap)return false;

let qb=chosen.find(p=>p.pos=="QB");
let dst=chosen.find(p=>p.pos=="DST");

if(document.getElementById("avoid").value=="yes" &&
qb && dst && qb.team==dst.team){

return false;

}

let qbs=chosen.filter(p=>p.pos=="QB").length;
let rbs=chosen.filter(p=>p.pos=="RB").length;
let wrs=chosen.filter(p=>p.pos=="WR").length;
let tes=chosen.filter(p=>p.pos=="TE").length;
let dsts=chosen.filter(p=>p.pos=="DST").length;

return qbs==1 &&
rbs>=2 &&
wrs>=3 &&
tes>=1 &&
dsts==1;

}

function makeLineup(){

  const cap = +document.getElementById("cap").value;
  const stackCount = Math.min(3, +document.getElementById("qbStack").value);
  const bringCount = Math.min(2, +document.getElementById("bring").value);

  const qbs = players.filter(p => p.pos === "QB");

  for(let attempt=0; attempt<500; attempt++){

    const qb = pick(qbs,1)[0];
    if(!qb) continue;
    let chosen = [qb];

    // QB STACK
    const stackPool = players.filter(p =>
      p.team === qb.team &&
      ["WR","TE"].includes(p.pos) &&
      !chosen.some(x => x.id === p.id)
    );

    if(stackPool.length < stackCount) continue;

    chosen.push(...pick(stackPool,stackCount));

    // BRING-BACK
    const bringPool = players.filter(p =>
      p.team === qb.opp &&
      ["RB","WR","TE"].includes(p.pos) &&
      !chosen.some(x => x.id === p.id)
    );

    if(bringPool.length < bringCount) continue;

    chosen.push(...pick(bringPool,bringCount));

    // Fill required positions
    function fillPosition(pos,minCount){

      const current = chosen.filter(p => p.pos === pos).length;
      const need = minCount - current;

      if(need <= 0) return true;

      const pool = players.filter(p =>
        p.pos === pos &&
        !chosen.some(x => x.id === p.id)
      );

      if(pool.length < need) return false;

      chosen.push(...pick(pool,need));

      return true;
    }

    if(!fillPosition("RB",2)) continue;
    if(!fillPosition("WR",3)) continue;
    if(!fillPosition("TE",1)) continue;
    if(!fillPosition("DST",1)) continue;

  // At this point we need exactly 8 players.
// Stack and bring-back players are already included
// in the RB/WR/TE position requirements.
// The 9th player is FLEX.
if(chosen.length !== 8) continue;

  const currentSalary = chosen.reduce(
  (total,p) => total + p.salary,
  0
);

const flexPool = players.filter(p =>
  ["RB","WR","TE"].includes(p.pos) &&
  !chosen.some(x => x.id === p.id) &&
  currentSalary + p.salary <= cap
);

if(!flexPool.length) continue;

chosen.push(pick(flexPool,1)[0]);

    // Final validation
    if(chosen.length !== 9) continue;

    const salary = chosen.reduce(
      (total,p) => total + p.salary,
      0
    );

    if(salary > cap) continue;

    const qbCount = chosen.filter(p => p.pos === "QB").length;
    const rbCount = chosen.filter(p => p.pos === "RB").length;
    const wrCount = chosen.filter(p => p.pos === "WR").length;
    const teCount = chosen.filter(p => p.pos === "TE").length;
    const dstCount = chosen.filter(p => p.pos === "DST").length;
    if(qbCount !== 1) continue;
if(rbCount < 2) continue;
if(wrCount < 3) continue;
if(teCount < 1) continue;
if(dstCount !== 1) continue;
    // Avoid QB vs DST
    const dst = chosen.find(p => p.pos === "DST");

    if(
      document.getElementById("avoid").value === "yes" &&
      dst &&
      dst.team === qb.team
    ){
      continue;
    }

    const projection = chosen.reduce(
      (total,p) => total + p.proj,
      0
    );

    const ceiling = chosen.reduce(
      (total,p) => total + p.ceil,
      0
    );

    return {
      players: chosen,
      salary,
      projection,
      ceiling,
      score: 0
    };
  }

  return null;
}

function generate(){

if(players.length<20){
    loadSample();
}
  
results=[];

let target=Math.min(
Math.max(1,+document.getElementById("num").value),
150
);

let exposure=Math.max(
1,
Math.floor(
target*(+document.getElementById("exposure").value/100)
)
);

let unique=+document.getElementById("unique").value;

let counts={};
let seen=[];

let tries=0;

document.getElementById("status").innerText=
"Generating and simulating...";

while(results.length<target && tries<target*10000){

tries++;

let lineup=makeLineup();

if(!lineup)continue;

let key=lineup.players
.map(p=>p.id)
.sort()
.join("|");

if(seen.includes(key))continue;

if(lineup.players.some(
p=>(counts[p.id]||0)>=exposure
))continue;

if(seen.length){

let previous=results[results.length-1];

let common=lineup.players.filter(
p=>previous.players.some(x=>x.id==p.id)
).length;

if(common>9-unique)continue;

}

seen.push(key);

lineup.score=scoreLineup(lineup);

lineup.players.forEach(
p=>counts[p.id]=(counts[p.id]||0)+1
);

results.push(lineup);

}

results.sort((a,b)=>b.score-a.score);

renderResults();

document.getElementById("status").innerText=
"Generated "+results.length+
" lineups after "+tries+" attempts.";

}

function renderResults(){

if(!results.length){

document.getElementById("results").innerText=
"No valid lineups found.";

return;

}

let html="";

results.slice(0,20).forEach((l,i)=>{

html+=`
<div class="lineup">
<div>
<strong>#${i+1}</strong>
&nbsp; $${l.salary.toLocaleString()}
&nbsp; <b>${l.score.toFixed(1)} sim pts</b>
</div>

<div class="small">
Projection: ${l.projection.toFixed(1)}
&nbsp; Ceiling: ${l.ceiling.toFixed(1)}
</div>

${l.players.map(p=>`
<div class="player">
<span>
<span class="badge">${p.pos}</span>
${p.name}
</span>
<span>${p.team}</span>
</div>
`).join("")}

</div>
`;

});

document.getElementById("results").innerHTML=html;

}

wr[0]?.name||"",
wr[1]?.name||"",
wr[2]?.name||"",
te[0]?.name||"",
flex?.name||"",
dst?.name||"",
l.salary,
l.projection.toFixed(2),
l.ceiling.toFixed(2),
l.score.toFixed(2)
]);

});

let csv=rows.map(
r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")
).join("\n");

let a=document.createElement("a");

a.href=URL.createObjectURL(
new Blob([csv],{type:"text/csv"})
);

a.download="nfl_dfs_lineups.csv";

a.click();

}

function copyTop(){

if(!results.length){

alert("Generate lineups first.");

return;

}

let l=results[0];

let text=l.players.map(
p=>`${p.pos}: ${p.name}`
).join("\n");

navigator.clipboard?.writeText(text)
.then(()=>alert("Top lineup copied."));

}
  
window.loadSample = loadSample;
window.clearPlayers = clearPlayers;
window.generate = generate;
window.copyTop = copyTop;
  
// Do not automatically load the sample pool

</script>
